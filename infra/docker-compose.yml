name: acp-local

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: acp
      POSTGRES_PASSWORD: acp
      POSTGRES_DB: acp
    ports:
      - "5432:5432"
    volumes:
      - acp_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acp -d acp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - acp_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: acp-minio
      MINIO_ROOT_PASSWORD: acp-minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - acp_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: create the `acp-assets` bucket once MinIO is healthy, then exit.
  minio-createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 acp-minio acp-minio-secret &&
        mc mb --ignore-existing local/acp-assets &&
        echo "bucket acp-assets ready"

  # ---- Application tier (built from the per-app Dockerfiles) ----
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      # Public base URL + CORS allowlist. Interpolated so a deployed host can set
      # its public HTTPS URL / allowed origins; defaults keep local dev working.
      API_BASE_URL: ${API_BASE_URL:-http://localhost:4000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4001}
      DATABASE_URL: postgresql://acp:acp@postgres:5432/acp?schema=public
      REDIS_URL: redis://redis:6379
      # Prod-required secrets with NO safe default — env.ts loadEnv rejects a
      # production boot without them, so the container would otherwise crash after
      # build. The ${VAR:?...} form fails LOUD at `docker compose up` (with a
      # helpful message) if unset. Never hardcoded — supply from the host env.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a strong value (>=16 chars, not the dev default)}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY to a >=32-char key for field-level PII encryption}
      # Object storage (S3-compatible). Interpolated but defaulted to the bundled
      # minio so the stack still boots out-of-the-box; export these to point a real
      # deployment at real S3 instead of hardcoding credentials in this file.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-acp-minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-acp-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-acp-assets}
      # Provider mode: 'stub' by default (no real ad platform is touched). Set
      # PROVIDERS_MODE=live and export the GOOGLE_ADS_* creds below for a real
      # Google Ads test; all default safely to empty so the stub path is unchanged.
      PROVIDERS_MODE: ${PROVIDERS_MODE:-stub}
      GOOGLE_ADS_CLIENT_ID: ${GOOGLE_ADS_CLIENT_ID:-}
      GOOGLE_ADS_CLIENT_SECRET: ${GOOGLE_ADS_CLIENT_SECRET:-}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      GOOGLE_ADS_REFRESH_TOKEN: ${GOOGLE_ADS_REFRESH_TOKEN:-}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${GOOGLE_ADS_LOGIN_CUSTOMER_ID:-}
      GOOGLE_ADS_CUSTOMER_ID: ${GOOGLE_ADS_CUSTOMER_ID:-}
      GOOGLE_ADS_API_VERSION: ${GOOGLE_ADS_API_VERSION:-v25}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-createbucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  workers:
    build:
      context: ..
      dockerfile: apps/workers/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Base URL used when the publish worker compiles a live creative bundle.
      API_BASE_URL: ${API_BASE_URL:-http://localhost:4000}
      DATABASE_URL: postgresql://acp:acp@postgres:5432/acp?schema=public
      REDIS_URL: redis://redis:6379
      # Same prod-required secrets as the api — the workers also loadEnv() in
      # production and crash at boot without them. Fail LOUD if unset.
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET to a strong value (>=16 chars, not the dev default)}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?set FIELD_ENCRYPTION_KEY to a >=32-char key for field-level PII encryption}
      # Object storage — defaulted to the bundled minio, overridable for real S3.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-acp-minio}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-acp-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-acp-assets}
      # The publish worker calls the ad connector, so it needs the same provider
      # config. Defaults to stub; export GOOGLE_ADS_* + PROVIDERS_MODE=live to test.
      PROVIDERS_MODE: ${PROVIDERS_MODE:-stub}
      GOOGLE_ADS_CLIENT_ID: ${GOOGLE_ADS_CLIENT_ID:-}
      GOOGLE_ADS_CLIENT_SECRET: ${GOOGLE_ADS_CLIENT_SECRET:-}
      GOOGLE_ADS_DEVELOPER_TOKEN: ${GOOGLE_ADS_DEVELOPER_TOKEN:-}
      GOOGLE_ADS_REFRESH_TOKEN: ${GOOGLE_ADS_REFRESH_TOKEN:-}
      GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${GOOGLE_ADS_LOGIN_CUSTOMER_ID:-}
      GOOGLE_ADS_CUSTOMER_ID: ${GOOGLE_ADS_CUSTOMER_ID:-}
      GOOGLE_ADS_API_VERSION: ${GOOGLE_ADS_API_VERSION:-v25}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the browser bundle at build time (NEXT_PUBLIC_*).
        NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  acp_pg:
  acp_redis:
  acp_minio:
